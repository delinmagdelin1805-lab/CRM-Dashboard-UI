<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CRM Dashboard</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>
            CRM Panel
        </h2>

        <ul>

            <li>Dashboard</li>

            <li>Customers</li>

            <li>Sales</li>

            <li>Reports</li>

            <li>Settings</li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="topbar">

            <h1>
                CRM Dashboard
            </h1>

            <button>
                Add Customer
            </button>

        </header>

        <!-- Cards -->

        <section class="cards">

            <div class="card">

                <h2>
                    Total Customers
                </h2>

                <p>
                    1,250
                </p>

            </div>

            <div class="card">

                <h2>
                    Monthly Sales
                </h2>

                <p>
                    $18,400
                </p>

            </div>

            <div class="card">

                <h2>
                    Pending Tasks
                </h2>

                <p>
                    24
                </p>

            </div>

        </section>

        <!-- Customer Table -->

        <section class="customers">

            <h2>
                Recent Customers
            </h2>

            <table>

                <tr>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Status</th>

                </tr>

                <tr>

                    <td>John Doe</td>

                    <td>john@example.com</td>

                    <td>Active</td>

                </tr>

                <tr>

                    <td>Emma Smith</td>

                    <td>emma@example.com</td>

                    <td>Pending</td>

                </tr>

                <tr>

                    <td>David Lee</td>

                    <td>david@example.com</td>

                    <td>Active</td>

                </tr>

            </table>

        </section>

    </main>

</body>

</html>
